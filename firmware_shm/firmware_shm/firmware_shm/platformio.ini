; ============================================================================
; PlatformIO Project Configuration File — Node SHM (Structural Health Monitoring)
;
; Target: ESP32 WROOM (dual-core, FreeRTOS sudah built-in di framework Arduino-ESP32,
; jadi TIDAK perlu library FreeRTOS terpisah — kita hanya memakai API-nya lewat
; <freertos/FreeRTOS.h>, <freertos/task.h>, <freertos/queue.h>, dst.)
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor & upload
monitor_speed = 115200
upload_speed = 921600

; ----------------------------------------------------------------------------
; Build flags
; ----------------------------------------------------------------------------
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; -D SHM_DEBUG_VERBOSE=1   ; aktifkan untuk logging tambahan saat development

; ----------------------------------------------------------------------------
; Library dependencies
;   - PubSubClient  : MQTT client ringan, cocok untuk 24/7 embedded operation
;   - ArduinoJson   : JSON build/parse untuk payload MQTT & config command
;   - SD & SPI      : sudah bawaan framework Arduino-ESP32 (tidak perlu ditulis di sini),
;                      tapi dicantumkan agar eksplisit dan tidak bergantung pada
;                      resolusi implisit PlatformIO.
; ----------------------------------------------------------------------------
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5

; SPI, Wire, WiFi, SD adalah bagian dari framework espressif32/arduino,
; tidak perlu ditambahkan sebagai lib_deps.
