<!DOCTYPE html>
<html lang="id">
<head>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('theme')||'dark')==='dark')</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHMS - Login</title>
<link rel="icon" type="image/png" href="/assets/js/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="login-page">

  <!-- Judul di paling atas -->
  <div class="login-topbar">
    <h1>SHMS SIMON BATAPA 2026</h1>
  </div>

  <!-- Background dekorasi -->
  <div class="login-decor">
    <div class="decor-block decor-block-1"></div>
    <div class="decor-block decor-block-2"></div>
    <div class="decor-outline decor-outline-1"></div>

    <svg class="decor-squiggle decor-squiggle-1" viewBox="0 0 100 24" fill="none">
      <path d="M2 18c8-16 16 16 24 0s16 16 24 0 16 16 24 0 16-8 24 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg class="decor-squiggle decor-squiggle-2" viewBox="0 0 100 24" fill="none">
      <path d="M2 6c8 16 16-16 24 0s16-16 24 0 16-16 24 0 16 8 24-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <span class="decor-dot decor-dot-1"></span>
    <span class="decor-dot decor-dot-2"></span>

  </div>

  <!-- Card login -->
  <div class="login-card">
    <h2 class="login-card-title">Operator Login</h2>

    <div class="field login-field">
      <label class="field-label" for="loginUsername">Username</label>
      <input id="loginUsername" type="text" class="field-input" placeholder="Masukkan username">
    </div>

    <div class="field login-field">
      <label class="field-label" for="loginPassword">Password</label>
      <div class="password-wrap">
        <input id="loginPassword" type="password" class="field-input" placeholder="Masukkan password">
        <button type="button" class="password-toggle" id="togglePassword">Show</button>
      </div>
    </div>

    <button id="btnSignIn" class="btn-primary btn-block" style="margin-top: 8px;">Sign In</button>

    <div class="login-divider"><span>Atau</span></div>

    <button id="btnGuest" class="btn-secondary btn-block">Continue as Guest</button>
  </div>

  <div class="login-footer">
    2026 SHMS &nbsp;|&nbsp; SIMON BATAPA PROFESSIONAL SERIES
  </div>

</div>

<script>
// Toggle show/hide password
document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('loginPassword');
    const isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    this.textContent = isPwd ? 'Hide' : 'Show';
});

// Masuk ke dashboard (login demo, tanpa validasi server)
document.getElementById('btnSignIn').addEventListener('click', function () {
    location.href = 'home.html';
});
document.getElementById('btnGuest').addEventListener('click', function () {
    location.href = 'home.html';
});

// Enter pada form = sign in
document.getElementById('loginPassword').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') location.href = 'home.html';
});
</script>
</body>
</html>
