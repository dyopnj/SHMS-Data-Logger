<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('theme')||'dark')==='dark')</script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" href="/assets/js/logo.png">
<title>SHMS - Logs</title>
</head>
<body class="bg-background text-on-background antialiased overflow-hidden h-screen flex">
<div id="sidebar"></div>
<main class="ml-[260px] flex-grow flex flex-col h-screen relative w-full">
<div id="header"></div>
<div class="flex-grow overflow-y-auto p-margin-desktop bg-background flex flex-col">

  <!-- Export Configuration -->
  <section class="mb-8 p-6 bg-surface-container-low rounded-lg border border-outline-variant">
    <h2 class="text-headline-md font-bold text-primary mb-6">Export Configuration</h2>
    <div class="flex flex-wrap items-end gap-4">
      <div class="flex flex-col gap-2 w-fit">
        <label class="text-[10px] uppercase tracking-widest font-label-mono text-on-surface-variant">Node ID</label>
        <select id="exportNode" class="bg-surface-variant border-none text-sm text-on-surface-variant rounded px-6 py-2 focus:ring-1 focus:ring-primary w-full">
          <option value="node_01">Node 01</option>
          <option value="node_02">Node 02</option>
        </select>
      </div>
      <div class="flex flex-col gap-2 w-fit">
        <label class="text-[10px] uppercase tracking-widest font-label-mono text-on-surface-variant">Start Time</label>
        <input id="exportStart" type="datetime-local" step="1" class="bg-surface-variant border-none text-sm text-on-surface-variant rounded px-3 py-2 focus:ring-1 focus:ring-primary w-full">
      </div>
      <div class="flex flex-col gap-2 w-fit">
        <label class="text-[10px] uppercase tracking-widest font-label-mono text-on-surface-variant">End Time</label>
        <input id="exportEnd" type="datetime-local" step="1" class="bg-surface-variant border-none text-sm text-on-surface-variant rounded px-3 py-2 focus:ring-1 focus:ring-primary w-full">
      </div>
      <button id="btnExport" class="flex items-center justify-center gap-2 bg-primary text-on-primary px-6 py-2.5 rounded-lg font-bold hover:opacity-90 transition-all active:scale-95 w-fit">
        <span class="material-symbols-outlined">download</span>
        Export to CSV
      </button>
    </div>
  </section>

  <!-- Export History -->
  <section class="p-6 bg-surface-container-low rounded-lg border border-outline-variant flex-grow h-full">
    <h2 class="text-headline-md font-bold text-primary mb-6">Export History</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-surface-container-high text-on-surface-variant text-[10px] uppercase tracking-widest font-label-mono">
            <th class="p-3 border-b border-outline-variant">Export Time</th>
            <th class="p-3 border-b border-outline-variant">Node ID</th>
            <th class="p-3 border-b border-outline-variant">Time Range</th>
            <th class="p-3 border-b border-outline-variant">Filename</th>
          </tr>
        </thead>
        <tbody id="exportHistoryBody" class="text-sm text-on-surface font-label-mono">
          <tr class="hover:bg-surface-variant/50 border-b border-outline-variant/30">
            <td class="p-3 text-on-surface-variant" colspan="4">Belum ada data export</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/logs.js"></script>
</body>
</html>
