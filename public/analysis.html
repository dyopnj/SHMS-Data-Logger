<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('theme')||'dark')==='dark')</script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link rel="icon" type="image/png" href="/assets/js/logo.png">
<title>SHMS - Analysis</title>
</head>
<body class="bg-background text-on-background font-body-md antialiased">
<div id="sidebar"></div>
<main class="ml-[260px] flex-1 min-h-screen">
<div id="header"></div>
<div class="p-margin-desktop">
<div class="h-14 flex items-center justify-between mb-4">
  <div class="flex items-center gap-4">
    <h1 class="font-headline-md text-headline-md text-on-surface">Structural Analysis Dashboard</h1>
    <span class="px-2 py-0.5 bg-primary-container/20 text-primary text-[10px] font-bold rounded border border-primary/30 uppercase tracking-widest">Multi-Sensor Feed</span>
  </div>
  <div class="flex items-center gap-6">
    <div class="flex items-center gap-4 text-[11px] font-label-mono">
      <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm bg-primary"></span><span class="text-on-surface">Node 01</span></span>
      <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm bg-tertiary"></span><span class="text-on-surface">Node 02</span></span>
    </div>
    <div class="flex items-center gap-1 bg-surface-container-highest p-1 rounded-lg">
      <button class="text-on-surface-variant hover:text-primary hover:bg-surface-variant transition-all rounded h-8 w-8 flex items-center justify-center" id="btn-reset-all" title="Reset All Layouts">
        <span class="material-symbols-outlined text-[20px]">restart_alt</span>
      </button>
    </div>
  </div>
</div>
<div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
  <!-- Accel X -->
  <div class="bg-surface-container border border-outline-variant rounded-xl flex flex-col overflow-hidden h-[480px]">
    <div class="px-4 py-3 border-b border-outline-variant bg-surface-container-high">
      <span class="text-sm font-bold text-on-surface tracking-tight">RMS VIBRATION</span>
    </div>
    <div class="flex-1 relative" id="plot-accel-x"></div>
    <div class="px-6 py-3 bg-surface-container-lowest/50 border-t border-outline-variant grid grid-cols-3 text-center">
      <div><span class="text-[10px] text-outline uppercase font-bold">Mean</span><span class="text-on-surface font-label-mono text-xs" id="stat-accel-x-mean">0.00</span></div>
      <div class="border-x border-outline-variant/30"><span class="text-[10px] text-outline uppercase font-bold">Median</span><span class="text-on-surface font-label-mono text-xs" id="stat-accel-x-median">0.00</span></div>
      <div><span class="text-[10px] text-outline uppercase font-bold">Peak</span><div class="flex justify-center gap-2 text-xs font-label-mono"><span class="text-primary" id="stat-accel-x-peak-n1">0.00</span><span class="text-outline">/</span><span class="text-tertiary" id="stat-accel-x-peak-n2">0.00</span></div></div>
    </div>
  </div>
  <!-- Accel Y -->
  <div class="bg-surface-container border border-outline-variant rounded-xl flex flex-col overflow-hidden h-[480px]">
    <div class="px-4 py-3 border-b border-outline-variant bg-surface-container-high">
      <span class="text-sm font-bold text-on-surface tracking-tight">PITCH</span>
    </div>
    <div class="flex-1 relative" id="plot-accel-y"></div>
    <div class="px-6 py-3 bg-surface-container-lowest/50 border-t border-outline-variant grid grid-cols-3 text-center">
      <div><span class="text-[10px] text-outline uppercase font-bold">Mean</span><span class="text-on-surface font-label-mono text-xs" id="stat-accel-y-mean">0.00</span></div>
      <div class="border-x border-outline-variant/30"><span class="text-[10px] text-outline uppercase font-bold">Median</span><span class="text-on-surface font-label-mono text-xs" id="stat-accel-y-median">0.00</span></div>
      <div><span class="text-[10px] text-outline uppercase font-bold">Peak</span><div class="flex justify-center gap-2 text-xs font-label-mono"><span class="text-primary" id="stat-accel-y-peak-n1">0.00</span><span class="text-outline">/</span><span class="text-tertiary" id="stat-accel-y-peak-n2">0.00</span></div></div>
    </div>
  </div>
  <!-- Accel Z -->
  <div class="bg-surface-container border border-outline-variant rounded-xl flex flex-col overflow-hidden h-[480px]">
    <div class="px-4 py-3 border-b border-outline-variant bg-surface-container-high">
      <span class="text-sm font-bold text-on-surface tracking-tight">ROLL</span>
    </div>
    <div class="flex-1 relative" id="plot-accel-z"></div>
    <div class="px-6 py-3 bg-surface-container-lowest/50 border-t border-outline-variant grid grid-cols-3 text-center">
      <div><span class="text-[10px] text-outline uppercase font-bold">Mean</span><span class="text-on-surface font-label-mono text-xs" id="stat-accel-z-mean">0.00</span></div>
      <div class="border-x border-outline-variant/30"><span class="text-[10px] text-outline uppercase font-bold">Median</span><span class="text-on-surface font-label-mono text-xs" id="stat-accel-z-median">0.00</span></div>
      <div><span class="text-[10px] text-outline uppercase font-bold">Peak</span><div class="flex justify-center gap-2 text-xs font-label-mono"><span class="text-primary" id="stat-accel-z-peak-n1">0.00</span><span class="text-outline">/</span><span class="text-tertiary" id="stat-accel-z-peak-n2">0.00</span></div></div>
    </div>
  </div>
  <!-- Gyro X -->
  <div class="bg-surface-container border border-outline-variant rounded-xl flex flex-col overflow-hidden h-[480px]">
    <div class="px-4 py-3 border-b border-outline-variant bg-surface-container-high">
      <span class="text-sm font-bold text-on-surface tracking-tight">MAGNETIC X</span>
    </div>
    <div class="flex-1 relative" id="plot-gyro-x"></div>
    <div class="px-6 py-3 bg-surface-container-lowest/50 border-t border-outline-variant grid grid-cols-3 text-center">
      <div><span class="text-[10px] text-outline uppercase font-bold">Mean</span><span class="text-on-surface font-label-mono text-xs" id="stat-gyro-x-mean">0.00</span></div>
      <div class="border-x border-outline-variant/30"><span class="text-[10px] text-outline uppercase font-bold">Median</span><span class="text-on-surface font-label-mono text-xs" id="stat-gyro-x-median">0.00</span></div>
      <div><span class="text-[10px] text-outline uppercase font-bold">Peak</span><div class="flex justify-center gap-2 text-xs font-label-mono"><span class="text-primary" id="stat-gyro-x-peak-n1">0.00</span><span class="text-outline">/</span><span class="text-tertiary" id="stat-gyro-x-peak-n2">0.00</span></div></div>
    </div>
  </div>
</div>
</div>
<footer class="px-margin-desktop py-6 text-center">
  <p class="text-on-surface-variant font-label-mono text-[10px] tracking-widest uppercase">© 2026 SHMS | Simon Batapa Professional Series</p>
</footer>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/analysis.js"></script>
</body>
</html>
